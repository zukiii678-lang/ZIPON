<script>
(function() {
  "use strict";

  const LESSON_DATA = JSON.parse(document.getElementById('mnn-data').textContent);
  const STORAGE_KEY = 'mnn1_user_progress_v4'; // updated key for new version

  // State Management
  let state = {
    currentTab: 'home',
    selectedLessonId: null,
    showRomaji: true,
    progress: {}, // { 'lessonId-vocabIdx': true }
    // Flashcard State
    fcIndex: 0,
    fcFlipped: false,
    fcLessonId: 1,
    // Quiz State
    quizMode: 'jp-to-id', // 'jp-to-id' or 'id-to-jp'
    quizQueue: [],
    quizIndex: 0,
    quizScore: 0,
    quizAnswered: false,
    quizSelectedOpt: null
  };

  function loadProgress() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state.progress = JSON.parse(saved);
    } catch (e) {
      console.warn("Gagal memuat simpanan progres.", e);
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    } catch (e) {
      console.error("Gagal menyimpan progres.", e);
    }
  }

  function getWordKey(lessonId, idx) {
    return `${lessonId}-${idx}`;
  }

  function isMemorized(lessonId, idx) {
    return !!state.progress[getWordKey(lessonId, idx)];
  }

  function toggleMemorized(lessonId, idx) {
    const key = getWordKey(lessonId, idx);
    if (state.progress[key]) {
      delete state.progress[key];
    } else {
      state.progress[key] = true;
    }
    saveProgress();
  }

  function getAllVocab() {
    const list = [];
    LESSON_DATA.forEach(l => {
      l.vocab.forEach((v, idx) => {
        list.push({
          lessonId: l.id,
          lessonTitle: l.title,
          idx: idx,
          jp: v[0],
          hira: v[1],
          roma: v[2],
          mean: v[3],
          key: getWordKey(l.id, idx)
        });
      });
    });
    return list;
  }

  // Text-To-Speech Pronunciation
  function speakJapanese(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }

  // Helper Utilities
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function renderRuby(jp, hira) {
    if (!hira || jp === hira) {
      return `<span class="jp-font font-bold text-lg text-amber-100">${escapeHtml(jp)}</span>`;
    }
    return `<ruby class="jp-font font-bold text-lg text-amber-100">${escapeHtml(jp)}<rt>${escapeHtml(hira)}</rt></ruby>`;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function render() {
    const main = document.getElementById('app-main');
    
    // Update Tab Navigation Styles
    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
      const tab = btn.dataset.tab;
      if (tab === state.currentTab) {
        btn.className = "nav-tab-btn flex-1 min-w-[70px] py-2 px-3 rounded-lg font-semibold text-center transition bg-[#28231d] text-[#e5a93c] border border-[#383028] shadow-sm";
      } else {
        btn.className = "nav-tab-btn flex-1 min-w-[70px] py-2 px-3 rounded-lg font-medium text-center transition text-[#a39788] hover:bg-[#1e1a15]";
      }
    });

    document.getElementById('romaji-status').textContent = state.showRomaji ? 'ON' : 'OFF';

    if (state.currentTab === 'home') {
      main.innerHTML = renderHome();
    } else if (state.currentTab === 'lessons') {
      main.innerHTML = state.selectedLessonId ? renderLessonDetail(state.selectedLessonId) : renderLessonList();
    } else if (state.currentTab === 'flashcard') {
      main.innerHTML = renderFlashcardView();
    } else if (state.currentTab === 'quiz') {
      main.innerHTML = renderQuizView();
    } else if (state.currentTab === 'search') {
      main.innerHTML = renderSearchView();
    } else if (state.currentTab === 'grammar') {
      main.innerHTML = renderGrammarView();
    }

    attachEvents();
  }

  // --- HOME VIEW ---
  function renderHome() {
    const all = getAllVocab();
    let memorizedCount = 0;
    all.forEach(w => { if (state.progress[w.key]) memorizedCount++; });
    const percent = all.length ? Math.round((memorizedCount / all.length) * 100) : 0;

    return `
      <div class="bg-gradient-to-br from-[#1e1a15] to-[#28231d] border border-[#383028] rounded-2xl p-6 text-center shadow-lg mb-6">
        <div class="text-xs uppercase font-bold tracking-widest text-[#a39788] mb-1">Status Progres Belajar (25 Bab)</div>
        <div class="text-4xl font-extrabold text-[#e5a93c] my-2 serif-jp">${memorizedCount} <span class="text-sm font-normal text-[#a39788]">/ ${all.length} kata</span></div>
        <p class="text-xs text-[#a39788] mb-4">Kosakata Minna no Nihongo I yang telah kamu kuasai</p>
        
        <div class="w-full bg-[#12100e] rounded-full h-2.5 overflow-hidden border border-[#383028] mb-5">
          <div class="bg-[#e5a93c] h-2.5 rounded-full transition-all duration-500" style="width: ${percent}%"></div>
        </div>

        <div class="flex gap-2">
          <button data-action="goto-flashcard" class="flex-1 bg-[#e5a93c] hover:bg-[#f0be5c] text-[#12100e] font-bold py-2.5 px-4 rounded-xl text-xs transition shadow">
            🎴 Latihan Flashcard
          </button>
          <button data-action="goto-quiz" class="flex-1 bg-[#1e1a15] hover:bg-[#28231d] text-[#e5a93c] border border-[#e5a93c] font-bold py-2.5 px-4 rounded-xl text-xs transition">
            🎯 Mulai Kuis
          </button>
        </div>
      </div>

      <h2 class="text-sm font-bold text-[#f2ebe1] mb-3 flex items-center justify-between">
        <span>📖 Daftar Bab (Bab 1–25)</span>
        <span class="text-xs text-[#a39788] font-normal">Total 25 Bab</span>
      </h2>

      <div class="space-y-2 mb-6">
        ${LESSON_DATA.map(l => {
          let count = 0;
          l.vocab.forEach((_, idx) => { if (isMemorized(l.id, idx)) count++; });
          const lPercent = Math.round((count / l.vocab.length) * 100);
          return `
            <div data-action="open-lesson" data-id="${l.id}" class="flex items-center justify-between p-3.5 bg-[#1e1a15] hover:bg-[#28231d] border border-[#383028] hover:border-[#e5a93c] rounded-xl cursor-pointer transition">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full ${count === l.vocab.length ? 'bg-[#52a868] text-white' : 'bg-[#28231d] text-[#e5a93c]'} border border-[#383028] flex items-center justify-center font-bold text-xs">
                  ${count === l.vocab.length ? '✓' : l.id}
                </div>
                <div>
                  <div class="text-xs font-bold text-[#f2ebe1]">Bab ${l.id}: ${escapeHtml(l.title)}</div>
                  <div class="text-[11px] text-[#a39788]">${count}/${l.vocab.length} dihafal (${lPercent}%)</div>
                </div>
              </div>
              <span class="text-[#a39788] text-sm">›</span>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // --- LESSONS LIST & DETAIL VIEW ---
  function renderLessonList() {
    return renderHome();
  }

  function renderLessonDetail(lessonId) {
    const lesson = LESSON_DATA.find(l => l.id === lessonId);
    if (!lesson) return '<p class="text-center py-8 text-xs text-[#a39788]">Bab tidak ditemukan.</p>';

    let count = 0;
    lesson.vocab.forEach((_, idx) => { if (isMemorized(lesson.id, idx)) count++; });
    const percent = Math.round((count / lesson.vocab.length) * 100);

    return `
      <button data-action="back-to-lessons" class="text-xs text-[#a39788] hover:text-[#e5a93c] flex items-center gap-1 mb-4">
        ‹ Kembali ke Daftar Bab
      </button>

      <div class="bg-[#1e1a15] border border-[#383028] p-4 rounded-xl mb-4">
        <div class="text-[10px] font-bold text-[#e5a93c] uppercase tracking-wider">BAB ${lesson.id}</div>
        <h2 class="text-lg font-bold text-[#f2ebe1] serif-jp mt-0.5">${escapeHtml(lesson.title)}</h2>
        <div class="flex items-center justify-between text-xs text-[#a39788] mt-3">
          <span>Progres Hafalan:</span>
          <span class="font-bold text-[#e5a93c]">${count} / ${lesson.vocab.length} (${percent}%)</span>
        </div>
      </div>

      <h3 class="text-xs font-bold text-[#a39788] uppercase tracking-wider mb-2">Kosakata (${lesson.vocab.length})</h3>

      <div class="bg-[#1e1a15] border border-[#383028] rounded-xl divide-y divide-[#383028] mb-6">
        ${lesson.vocab.map((v, idx) => {
          const memorized = isMemorized(lesson.id, idx);
          const jp = v[0];
          const hira = v[1];
          const roma = v[2];
          const mean = v[3];

          return `
            <div class="p-3.5 flex items-center justify-between gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-baseline gap-2">
                  ${renderRuby(jp, hira)}
                  ${state.showRomaji ? `<span class="text-xs text-[#a39788]">${escapeHtml(roma)}</span>` : ''}
                </div>
                <div class="text-xs text-[#a39788] mt-1">${escapeHtml(mean)}</div>
              </div>

              <div class="flex items-center gap-2">
                <button data-action="speak-text" data-text="${escapeHtml(hira || jp)}" class="p-2 rounded-lg bg-[#28231d] text-[#a39788] hover:text-[#e5a93c] transition text-sm">
                  🔊
                </button>
                <button data-action="toggle-word-fav" data-lesson="${lesson.id}" data-idx="${idx}" class="p-2 rounded-lg border ${memorized ? 'bg-[#52a868] border-[#52a868] text-white' : 'border-[#383028] bg-[#12100e] text-[#a39788] hover:border-[#e5a93c]'} text-xs font-bold transition">
                  ${memorized ? '✓ Hafal' : '+ Hafal'}
                </button>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <h3 class="text-xs font-bold text-[#a39788] uppercase tracking-wider mb-2">Ringkasan Pola Tata Bahasa</h3>
      <div class="bg-[#1e1a15] border border-[#383028] rounded-xl p-4 space-y-2 mb-8 text-xs text-[#f2ebe1]">
        ${lesson.grammar.map(g => `<div class="p-2.5 bg-[#28231d] border-l-2 border-[#e5a93c] rounded-r-lg">${g}</div>`).join('')}
      </div>
    `;
  }

  // --- FLASHCARD VIEW ---
  function renderFlashcardView() {
    const currentLesson = LESSON_DATA.find(l => l.id === state.fcLessonId) || LESSON_DATA[0];
    const vocabList = currentLesson.vocab;
    const word = vocabList[state.fcIndex] || vocabList[0];

    const jp = word[0];
    const hira = word[1];
    const roma = word[2];
    const mean = word[3];
    const memorized = isMemorized(currentLesson.id, state.fcIndex);

    return `
      <div class="mb-4 flex items-center justify-between gap-2">
        <h2 class="text-sm font-bold text-[#f2ebe1]">🎴 Flashcard Latihan</h2>
        <select id="fc-lesson-select" class="bg-[#1e1a15] text-xs text-[#e5a93c] border border-[#383028] rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-[#e5a93c]">
          ${LESSON_DATA.map(l => `<option value="${l.id}" ${l.id === state.fcLessonId ? 'selected' : ''}>Bab ${l.id}: ${escapeHtml(l.title)}</option>`).join('')}
        </select>
      </div>

      <div class="text-center text-xs text-[#a39788] mb-2">
        Kartu ${state.fcIndex + 1} dari ${vocabList.length}
      </div>

      <!-- Flashcard Container -->
      <div id="flashcard-card" data-action="flip-card" class="perspective-1000 w-full cursor-pointer my-4">
        <div class="relative w-full h-64 rounded-2xl bg-[#1e1a15] border-2 border-[#383028] hover:border-[#e5a93c] transition-all duration-300 shadow-xl flex flex-col items-center justify-center p-6 text-center">
          
          ${!state.fcFlipped ? `
            <!-- SISI DEPAN (JEPANG) -->
            <div class="text-xs text-[#a39788] uppercase tracking-wider mb-2">Bahasa Jepang</div>
            <div class="my-auto">
              <div class="text-3xl font-bold text-amber-100 serif-jp mb-2">${renderRuby(jp, hira)}</div>
              ${state.showRomaji ? `<div class="text-sm text-[#a39788]">${escapeHtml(roma)}</div>` : ''}
            </div>
            <div class="text-[11px] text-[#a39788] mt-2">💡 Klik untuk balik kartu</div>
          ` : `
            <!-- SISI BELAKANG (INDONESIA) -->
            <div class="text-xs text-[#e5a93c] uppercase tracking-wider mb-2">Arti / Bahasa Indonesia</div>
            <div class="my-auto">
              <div class="text-xl font-bold text-[#f2ebe1]">${escapeHtml(mean)}</div>
            </div>
            <div class="text-[11px] text-[#a39788] mt-2">💡 Klik untuk balik kartu</div>
          `}

        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-between gap-2 mt-4">
        <button data-action="fc-prev" class="flex-1 py-3 px-3 bg-[#1e1a15] border border-[#383028] hover:bg-[#28231d] text-[#f2ebe1] font-semibold text-xs rounded-xl transition">
          ◀ Sebelum
        </button>
        <button data-action="speak-text" data-text="${escapeHtml(hira || jp)}" class="p-3 bg-[#28231d] border border-[#383028] text-[#e5a93c] rounded-xl text-base hover:border-[#e5a93c]">
          🔊
        </button>
        <button data-action="toggle-word-fav" data-lesson="${currentLesson.id}" data-idx="${state.fcIndex}" class="p-3 bg-[#1e1a15] border border-[#383028] ${memorized ? 'text-[#52a868]' : 'text-[#a39788]'} rounded-xl text-base hover:border-[#e5a93c]">
          ${memorized ? '★' : '☆'}
        </button>
        <button data-action="fc-next" class="flex-1 py-3 px-3 bg-[#e5a93c] text-[#12100e] font-bold text-xs rounded-xl hover:bg-[#f0be5c] transition">
          Lanjut ▶
        </button>
      </div>
    `;
  }

  // --- QUIZ VIEW ---
  function initQuiz() {
    const all = getAllVocab();
    let list = all.filter(w => isMemorized(w.lessonId, w.idx));
    if (list.length < 4) list = all; // Fallback to all if less than 4 memorized

    state.quizQueue = shuffle(list);
    state.quizIndex = 0;
    state.quizScore = 0;
    state.quizAnswered = false;
    state.quizSelectedOpt = null;
  }

  function renderQuizView() {
    if (!state.quizQueue || state.quizQueue.length === 0) {
      initQuiz();
    }

    if (state.quizIndex >= state.quizQueue.length) {
      return `
        <div class="bg-[#1e1a15] border border-[#383028] rounded-2xl p-8 text-center my-6">
          <div class="text-4xl mb-2">🎉</div>
          <h2 class="text-lg font-bold text-[#f2ebe1] mb-1">Kuis Selesai!</h2>
          <p class="text-xs text-[#a39788] mb-4">Kamu telah menyelesaikan latihan kuis ini.</p>
          <div class="text-3xl font-extrabold text-[#e5a93c] mb-6">${state.quizScore} / ${state.quizQueue.length} <span class="text-xs text-[#a39788]">Benar</span></div>
          <button data-action="reset-quiz" class="w-full bg-[#e5a93c] text-[#12100e] font-bold py-3 rounded-xl text-xs hover:bg-[#f0be5c] transition">
            Ulangi Kuis Sekarang
          </button>
        </div>
      `;
    }

    const currentItem = state.quizQueue[state.quizIndex];
    const all = getAllVocab();

    let distractors = all.filter(w => w.key !== currentItem.key);
    distractors = shuffle(distractors).slice(0, 3);
    const options = shuffle([currentItem, ...distractors]);

    return `
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-[#f2ebe1]">🎯 Kuis Pilihan Ganda</h2>
        <div class="flex gap-1 bg-[#1e1a15] p-1 rounded-lg border border-[#383028]">
          <button data-action="set-quiz-mode" data-mode="jp-to-id" class="px-2 py-1 text-[10px] rounded font-semibold ${state.quizMode === 'jp-to-id' ? 'bg-[#e5a93c] text-[#12100e]' : 'text-[#a39788]'}">
            🇯🇵 ➔ 🇮🇩
          </button>
          <button data-action="set-quiz-mode" data-mode="id-to-jp" class="px-2 py-1 text-[10px] rounded font-semibold ${state.quizMode === 'id-to-jp' ? 'bg-[#e5a93c] text-[#12100e]' : 'text-[#a39788]'}">
            🇮🇩 ➔ 🇯🇵
          </button>
        </div>
      </div>

      <div class="text-xs text-[#a39788] text-center mb-3">
        Soal ${state.quizIndex + 1} dari ${state.quizQueue.length} — Bab ${currentItem.lessonId}
      </div>

      <!-- Question Card -->
      <div class="bg-[#1e1a15] border border-[#383028] rounded-2xl p-6 text-center shadow-lg mb-4">
        ${state.quizMode === 'jp-to-id' ? `
          <div class="text-2xl font-bold text-amber-100 mb-1 serif-jp">${renderRuby(currentItem.jp, currentItem.hira)}</div>
          ${state.showRomaji ? `<div class="text-xs text-[#a39788]">${escapeHtml(currentItem.roma)}</div>` : ''}
        ` : `
          <div class="text-sm text-[#a39788] mb-1">Pilih Bahasa Jepang untuk:</div>
          <div class="text-xl font-bold text-[#f2ebe1]">${escapeHtml(currentItem.mean)}</div>
        `}
      </div>

      <!-- Multiple Choice Options -->
      <div class="space-y-2 mb-6">
        ${options.map((opt) => {
          const isCorrect = opt.key === currentItem.key;
          const isSelected = state.quizSelectedOpt === opt.key;
          let btnStyle = "bg-[#1e1a15] border-[#383028] text-[#f2ebe1] hover:border-[#e5a93c]";

          if (state.quizAnswered) {
            if (isCorrect) {
              btnStyle = "bg-[#1c3823] border-[#52a868] text-green-200 font-bold";
            } else if (isSelected) {
              btnStyle = "bg-[#381c1c] border-[#d94b4b] text-red-200 font-bold";
            } else {
              btnStyle = "bg-[#12100e] border-[#28231d] text-[#a39788] opacity-50";
            }
          }

          return `
            <button data-action="answer-quiz" data-key="${opt.key}" ${state.quizAnswered ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-xl border ${btnStyle} transition flex items-center justify-between text-xs">
              ${state.quizMode === 'jp-to-id' ? `
                <span>${escapeHtml(opt.mean)}</span>
              ` : `
                <span>${escapeHtml(opt.jp)} (${escapeHtml(opt.hira)})</span>
              `}
              ${state.quizAnswered && isCorrect ? '<span>✓</span>' : ''}
            </button>
          `;
        }).join('')}
      </div>

      ${state.quizAnswered ? `
        <button data-action="next-quiz" class="w-full bg-[#e5a93c] hover:bg-[#f0be5c] text-[#12100e] font-bold py-3 rounded-xl text-xs transition shadow-lg">
          Lanjut Soal Berikutnya ➔
        </button>
      ` : ''}
    `;
  }

  // --- SEARCH VIEW ---
  function renderSearchView() {
    return `
      <div class="mb-4">
        <h2 class="text-sm font-bold text-[#f2ebe1] mb-2">🔍 Cari Kosakata (Bab 1–25)</h2>
        <input type="text" id="global-search-input" placeholder="Cari kanji, hiragana, romaji, atau arti..." class="w-full bg-[#1e1a15] border border-[#383028] focus:border-[#e5a93c] text-xs text-[#f2ebe1] p-3 rounded-xl focus:outline-none">
      </div>

      <div id="search-results-container" class="space-y-2">
        <div class="text-center text-xs text-[#a39788] py-8">Ketik kata kunci di atas untuk mencari kosakata.</div>
      </div>
    `;
  }

  // --- GRAMMAR VIEW ---
  function renderGrammarView() {
    return `
      <h2 class="text-sm font-bold text-[#f2ebe1] mb-3">🔤 Panduan Partikel &amp; Tata Bahasa Utama</h2>

      <div class="space-y-3 mb-8">
        <div class="bg-[#1e1a15] border border-[#383028] p-4 rounded-xl">
          <div class="text-xs font-bold text-[#e5a93c] mb-1">Partikel は (Wa) — Topik Kalimat</div>
          <p class="text-xs text-[#a39788]">Menandai topik utama yang dibicarakan dalam kalimat.</p>
          <div class="mt-2 text-xs bg-[#28231d] p-2 rounded text-[#f2ebe1]">Contoh: わたし<b>は</b> 学生です。</div>
        </div>

        <div class="bg-[#1e1a15] border border-[#383028] p-4 rounded-xl">
          <div class="text-xs font-bold text-[#e5a93c] mb-1">Partikel を (O) — Objek Langsung</div>
          <p class="text-xs text-[#a39788]">Menandai objek penderita dari kata kerja transitif.</p>
          <div class="mt-2 text-xs bg-[#28231d] p-2 rounded text-[#f2ebe1]">Contoh: ご飯<b>を</b> 食べます。</div>
        </div>

        <div class="bg-[#1e1a15] border border-[#383028] p-4 rounded-xl">
          <div class="text-xs font-bold text-[#e5a93c] mb-1">Partikel に (Ni) — Waktu, Lokasi &amp; Tujuan</div>
          <p class="text-xs text-[#a39788]">Menunjukkan titik waktu, lokasi keberadaan (います/あります), atau penerima bantuan.</p>
          <div class="mt-2 text-xs bg-[#28231d] p-2 rounded text-[#f2ebe1]">Contoh: 7時<b>に</b> 起きます / 友達<b>に</b> 会います。</div>
        </div>

        <div class="bg-[#1e1a15] border border-[#383028] p-4 rounded-xl">
          <div class="text-xs font-bold text-[#e5a93c] mb-1">Partikel で (De) — Tempat Aksi &amp; Alat</div>
          <p class="text-xs text-[#a39788]">Menunjukkan tempat dilakukannya aktivitas atau sarana/alat yang digunakan.</p>
          <div class="mt-2 text-xs bg-[#28231d] p-2 rounded text-[#f2ebe1]">Contoh: 図書館<b>で</b> 勉強します / バス<b>で</b> 行きます。</div>
        </div>

        <div class="bg-[#1e1a15] border border-[#383028] p-4 rounded-xl">
          <div class="text-xs font-bold text-[#e5a93c] mb-1">Partikel へ (E) — Arah Perjalanan</div>
          <p class="text-xs text-[#a39788]">Menunjukkan arah pergerakan menuju suatu tempat.</p>
          <div class="mt-2 text-xs bg-[#28231d] p-2 rounded text-[#f2ebe1]">Contoh: 日本<b>へ</b> 行きます。</div>
        </div>

        <div class="bg-[#1e1a15] border border-[#383028] p-4 rounded-xl">
          <div class="text-xs font-bold text-[#e5a93c] mb-1">Bentuk Kata Kerja Dasar (N5)</div>
          <p class="text-xs text-[#a39788]">
            <b>~てください</b> (Permintaan) | <b>~ています</b> (Sedang/Keadaan)<br>
            <b>~てもいい</b> (Izin) | <b>~てはいけない</b> (Larangan)<br>
            <b>~ないで</b> (Jangan) | <b>~なければならない</b> (Harus)<br>
            <b>~ことができる</b> (Kemampuan) | <b>~たことがある</b> (Pengalaman)
          </p>
        </div>
      </div>
    `;
  }

  function attachEvents() {
    document.querySelectorAll('[data-action]').forEach(el => {
      el.onclick = handleAction;
    });

    // Tab Navigation
    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
      btn.onclick = () => {
        state.currentTab = btn.dataset.tab;
        if (state.currentTab === 'lessons') state.selectedLessonId = null;
        render();
      };
    });

    // Romaji Toggle
    const romajiBtn = document.getElementById('toggle-romaji-btn');
    if (romajiBtn) {
      romajiBtn.onclick = () => {
        state.showRomaji = !state.showRomaji;
        render();
      };
    }

    // Flashcard Lesson Selector Listener
    const fcSelect = document.getElementById('fc-lesson-select');
    if (fcSelect) {
      fcSelect.onchange = (e) => {
        state.fcLessonId = parseInt(e.target.value, 10);
        state.fcIndex = 0;
        state.fcFlipped = false;
        render();
      };
    }

    // Global Search Input Listener
    const searchInput = document.getElementById('global-search-input');
    if (searchInput) {
      searchInput.oninput = (e) => {
        const query = e.target.value.toLowerCase().trim();
        const container = document.getElementById('search-results-container');
        if (!query) {
          container.innerHTML = `<div class="text-center text-xs text-[#a39788] py-8">Ketik kata kunci di atas untuk mencari kosakata.</div>`;
          return;
        }

        const all = getAllVocab();
        const results = all.filter(w => 
          w.jp.toLowerCase().includes(query) ||
          w.hira.toLowerCase().includes(query) ||
          w.roma.toLowerCase().includes(query) ||
          w.mean.toLowerCase().includes(query)
        );

        if (results.length === 0) {
          container.innerHTML = `<div class="text-center text-xs text-[#a39788] py-8">Tidak ada hasil ditemukan.</div>`;
          return;
        }

        container.innerHTML = results.map(w => `
          <div class="bg-[#1e1a15] border border-[#383028] p-3 rounded-xl flex items-center justify-between text-xs">
            <div>
              <div class="flex items-baseline gap-2">
                ${renderRuby(w.jp, w.hira)}
                <span class="text-[#a39788]">${escapeHtml(w.roma)}</span>
              </div>
              <div class="text-[#a39788] mt-0.5">${escapeHtml(w.mean)} <span class="text-[10px] text-[#e5a93c] ml-1">(Bab ${w.lessonId})</span></div>
            </div>
            <button data-action="speak-text" data-text="${escapeHtml(w.hira || w.jp)}" class="p-2 rounded-lg bg-[#28231d] text-[#a39788] hover:text-[#e5a93c]">
              🔊
            </button>
          </div>
        `).join('');

        container.querySelectorAll('[data-action="speak-text"]').forEach(btn => {
          btn.onclick = handleAction;
        });
      };
    }
  }

  function handleAction(e) {
    const el = e.currentTarget;
    const action = el.dataset.action;

    if (action === 'open-lesson') {
      state.selectedLessonId = parseInt(el.dataset.id, 10);
      render();
    } else if (action === 'back-to-lessons') {
      state.selectedLessonId = null;
      render();
    } else if (action === 'goto-flashcard') {
      state.currentTab = 'flashcard';
      render();
    } else if (action === 'goto-quiz') {
      state.currentTab = 'quiz';
      initQuiz();
      render();
    } else if (action === 'toggle-word-fav') {
      const lessonId = parseInt(el.dataset.lesson, 10);
      const idx = parseInt(el.dataset.idx, 10);
      toggleMemorized(lessonId, idx);
      render();
    } else if (action === 'speak-text') {
      speakJapanese(el.dataset.text);
    } else if (action === 'flip-card') {
      state.fcFlipped = !state.fcFlipped;
      render();
    } else if (action === 'fc-next') {
      const lesson = LESSON_DATA.find(l => l.id === state.fcLessonId) || LESSON_DATA[0];
      state.fcIndex = (state.fcIndex + 1) % lesson.vocab.length;
      state.fcFlipped = false;
      render();
    } else if (action === 'fc-prev') {
      const lesson = LESSON_DATA.find(l => l.id === state.fcLessonId) || LESSON_DATA[0];
      state.fcIndex = (state.fcIndex - 1 + lesson.vocab.length) % lesson.vocab.length;
      state.fcFlipped = false;
      render();
    } else if (action === 'set-quiz-mode') {
      state.quizMode = el.dataset.mode;
      initQuiz();
      render();
    } else if (action === 'answer-quiz') {
      if (state.quizAnswered) return;
      const key = el.dataset.key;
      const currentItem = state.quizQueue[state.quizIndex];
      state.quizSelectedOpt = key;
      state.quizAnswered = true;

      if (key === currentItem.key) {
        state.quizScore++;
      }
      render();
    } else if (action === 'next-quiz') {
      state.quizIndex++;
      state.quizAnswered = false;
      state.quizSelectedOpt = null;
      render();
    } else if (action === 'reset-quiz') {
      initQuiz();
      render();
    }
  }

  document.getElementById('header-logo').onclick = () => {
    state.currentTab = 'home';
    state.selectedLessonId = null;
    render();
  };

  loadProgress();
  render();

})();
</script>
</body>
</html>
