<style>
:root{ --bg:#020617; --card:#0f172a; --card2:#1e293b; --line:#1e3a8a33; --pri:#2563eb; --acc:#38bdf8; }
body{background:radial-gradient(1200px 600px at 20% -10%, #1d4ed822, transparent), radial-gradient(900px 500px at 90% 0%, #0ea5e922, transparent), var(--bg); color:#e2e8f0; font-family:'Plus Jakarta Sans',system-ui,sans-serif; min-height:100vh;}
.serif-jp{font-family:'Noto Serif JP',serif} .jp-font{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
ruby{ruby-position:over} ruby rt{font-size:.78em;color:#fde68a;font-weight:800;user-select:none;letter-spacing:.02em;text-shadow:0 1px 2px #000}
.kana-line{font-size:13px;color:#fde68a;background:#f59e0b1a;border:1px solid #f59e0b44;border-radius:.6rem;padding:2px 8px;display:inline-block;margin-top:6px;font-weight:600}
.roma-line{font-size:12px;color:#cbd5e1}
.mean-line{font-size:13px;color:#e2e8f0;margin-top:2px}
.layout{max-width:72rem;margin:0 auto;padding-left:1rem;padding-right:1rem;width:100%}
@media(min-width:1024px){.bab-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.bab-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}}
.card{background:linear-gradient(180deg,#0f172a,#0b1226);border:1px solid #1e3a8a55;border-radius:1.1rem}
.card-hover{transition:.25s} .card-hover:hover{transform:translateY(-3px);border-color:#38bdf8;box-shadow:0 12px 32px -12px #2563eb66}
.btn-pri{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;font-weight:800;transition:.2s;box-shadow:0 8px 24px -8px #2563eb88}
.btn-pri:hover{filter:brightness(1.12);transform:translateY(-1px)} .btn-ghost{background:#0f172a;border:1px solid #1e40af66} .btn-ghost:hover{border-color:#38bdf8}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.anim{animation:fadeUp .45s ease both} .anim-1{animation-delay:.05s}.anim-2{animation-delay:.12s}.anim-3{animation-delay:.18s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}} .floaty{animation:floaty 5s ease-in-out infinite}
@keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero{background:linear-gradient(120deg,#1e40af,#2563eb,#0ea5e9,#1e40af);background-size:300% 300%;animation:gradShift 10s ease infinite}
.ring{transform:rotate(-90deg)} .ring-fg{transition:stroke-dashoffset 1s ease}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#1e40af;border-radius:8px}::-webkit-scrollbar-track{background:#020617}
.chip{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid #38bdf855;color:#7dd3fc;background:#0ea5e914}
.kbd{background:#1e293b;border:1px solid #334155;border-bottom-width:3px;border-radius:.5rem;padding:.1rem .5rem;font-size:11px}
.toast{animation:fadeUp .3s ease} .flip{perspective:1200px} .flip-inner{transition:transform .5s;transform-style:preserve-3d}
.confetti{position:fixed;top:-10px;width:8px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
input,select,textarea{outline:none} input:focus,select:focus{border-color:#38bdf8 !important;box-shadow:0 0 0 3px #38bdf833}
.tab-active{background:#1d4ed8 !important;color:#fff !important;border-color:#38bdf8 !important;box-shadow:0 6px 20px -6px #2563eb}

<script>
(function(){
"use strict";
const FALLBACK = (typeof LESSON_DATA_FALLBACK!=="undefined")?LESSON_DATA_FALLBACK:[];
let LESSONS = FALLBACK.map(l=>({id:l.id,title:l.title,vocab:l.vocab||[],grammar:l.grammar||[]}));
let DATA_SRC = "lokal (mnn-data.js)";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const todayStr=(d=new Date())=>d.toISOString().slice(0,10);
function weekStart(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x;}
const LS={srs:"zipun_srs_v1",log:"zipun_logs_v1",goal:"zipun_goal_v1",fav:"zipun_fav_v1",pat:"zipun_pat_v1"};
let SRS={}, LOGS={}, GOAL={xp:300,words:100,days:5}, FAV={}, PAT={};
try{SRS=JSON.parse(localStorage.getItem(LS.srs)||"{}");LOGS=JSON.parse(localStorage.getItem(LS.log)||"{}");GOAL={...GOAL,...JSON.parse(localStorage.getItem(LS.goal)||"{}")};FAV=JSON.parse(localStorage.getItem(LS.fav)||"{}");PAT=JSON.parse(localStorage.getItem(LS.pat)||"{}");}catch(e){}
const save=k=>{try{localStorage.setItem(LS.srs,JSON.stringify(SRS));localStorage.setItem(LS.log,JSON.stringify(LOGS));localStorage.setItem(LS.goal,JSON.stringify(GOAL));localStorage.setItem(LS.fav,JSON.stringify(FAV));localStorage.setItem(LS.pat,JSON.stringify(PAT));}catch(e){}};
const key=(lid,i)=>lid+"-"+i;
function allWords(){const a=[];LESSONS.forEach(l=>l.vocab.forEach((v,i)=>a.push({lid:l.id,title:l.title,idx:i,jp:v[0],kana:v[1],roma:v[2],mean:v[3],k:key(l.id,i)})));return a;}
function srsGet(k){if(!SRS[k])SRS[k]={ease:2.5,interval:0,reps:0,lapses:0,due:0,mem:false};return SRS[k];}
// SM-2: quality 0-5 (>=3 benar)
function srsReview(k,q){const s=srsGet(k);if(q>=3){if(s.reps===0)s.interval=1;else if(s.reps===1)s.interval=6;else s.interval=Math.round(s.interval*s.ease);s.reps++;s.ease=Math.max(1.3,s.ease+(0.1-(5-q)*(0.08+(5-q)*0.02)));}else{s.lapses++;s.reps=0;s.interval=0.02;}s.due=Date.now()+s.interval*864e5;s.mem=(s.reps>=2&&q>=4)||s.mem;save();return s;}
function dueWords(){const now=Date.now();return allWords().filter(w=>{const s=SRS[w.k];if(!s)return true;return s.due<=now;});}
function memorizedCount(){return Object.values(SRS).filter(s=>s.mem).length + Object.keys(FAV).length*0; }
function addXP(n,mins=1,ok=1,tot=1){const t=todayStr();if(!LOGS[t])LOGS[t]={xp:0,mins:0,ok:0,tot:0};LOGS[t].xp+=n;LOGS[t].mins+=mins;LOGS[t].ok+=ok;LOGS[t].tot+=tot;save();updateHeader();syncLog(t);}
async function syncLog(date){const sc=getSupa();if(!sc)return;try{const u=(await sc.auth.getUser()).data.user;if(!u)return;await sc.from("study_logs").upsert({user_id:u.id,date,xp:LOGS[date].xp,minutes:LOGS[date].mins,correct:LOGS[date].ok,total:LOGS[date].tot},{onConflict:"id"});}catch(e){}}
function weekStats(){const ws=weekStart();let xp=0,days=0,ok=0,tot=0;for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);const s=todayStr(d);if(LOGS[s]){xp+=LOGS[s].xp||0;ok+=LOGS[s].ok||0;tot+=LOGS[s].tot||0;if((LOGS[s].xp||0)>0)days++;}}return{xp,days,ok,tot,ws};}
function streak(){let s=0;let d=new Date();if(!LOGS[todayStr(d)])d.setDate(d.getDate()-1);while(LOGS[todayStr(d)]&&LOGS[todayStr(d)].xp>0){s++;d.setDate(d.getDate()-1);}return s;}
function getSupa(){try{if(window.supabaseClient)return window.supabaseClient;}catch(e){} return null;}
function supaStatus(){try{return window.zipunSupaStatus||{mode:"offline",reason:"unknown"};}catch(e){return{mode:"offline",reason:"err"}}}
function updateHeader(){$("#streak").textContent=streak();$("#xp-today").textContent=(LOGS[todayStr()]?.xp||0);const st=supaStatus();$("#data-src").textContent=DATA_SRC+(st.mode==="online"?" + Supabase 🟢":" (offline 🟡)");const fb=$("#furi-btn");if(fb)fb.textContent="かな: "+(S.showFuri?"ON":"OFF");const rb=$("#roma-btn");if(rb)rb.textContent="Romaji: "+(S.showRoma?"ON":"OFF");}
function toast(msg){const t=document.createElement("div");t.className="toast card px-3 py-2 text-xs border-sky-500/50";t.innerHTML=msg;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),2600);}
function confetti(n=40){for(let i=0;i<n;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=["#38bdf8","#2563eb","#facc15","#f472b6","#34d399"][i%5];c.style.animationDuration=(1.5+Math.random()*1.5)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),3000);}}
function speak(t,rate=0.85){try{ if(!("speechSynthesis" in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=rate;speechSynthesis.speak(u);}catch(e){}}
function ruby(jp,hira){const showF=(typeof S!=="undefined")?S.showFuri:true;if(!hira||jp===hira||!showF)return `<span class="jp-font font-bold text-xl text-white">${esc(jp)}</span>`;return `<ruby class="jp-font font-bold text-xl text-white">${esc(jp)}<rt>${esc(hira)}</rt></ruby>`;}
function kanaLine(hira,roma){let h="";if((typeof S==="undefined"||S.showFuri)&&hira)h+=`<span class="kana-line">🈁 ${esc(hira)}</span>`;if((typeof S==="undefined"||S.showRoma)&&roma)h+=` <span class="roma-line">${esc(roma)}</span>`;return h;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let S={tab:"home",lesson:null,showRoma:true,showFuri:true,fcList:[],fcIdx:0,flip:false,quiz:{mode:"pg-jp",q:[],i:0,score:0,ans:null,curOpts:[]},patLesson:1,patIdx:0,patMode:"belajar",patQuiz:null,chal:{active:false,sec:300,q:[],i:0,score:0,timer:null}};
try{const _f=JSON.parse(localStorage.getItem("zipun_view_v1")||"{}");if(typeof _f.showFuri==="boolean")S.showFuri=_f.showFuri;if(typeof _f.showRoma==="boolean")S.showRoma=_f.showRoma;}catch(e){}
function saveView(){try{localStorage.setItem("zipun_view_v1",JSON.stringify({showFuri:S.showFuri,showRoma:S.showRoma}));}catch(e){}}

function setTab(t){S.tab=t;if(t==="flashcard"&&!S.fcList.length)resetSRSQueue();render();}
function resetSRSQueue(){let d=dueWords();if(d.length<5)d=shuffle(allWords()).slice(0,20);else d=shuffle(d).slice(0,20);S.fcList=d;S.fcIdx=0;S.flip=false;}
function quizInit(mode){S.quiz.mode=mode||S.quiz.mode;let pool=dueWords();if(pool.length<8)pool=allWords();pool=shuffle(pool).slice(0,15);S.quiz.q=pool;S.quiz.i=0;S.quiz.score=0;S.quiz.ans=null;newQuizOpts();}
function newQuizOpts(){const cur=S.quiz.q[S.quiz.i];if(!cur)return;const all=allWords().filter(w=>w.k!==cur.k);S.quiz.curOpts=shuffle([cur,...shuffle(all).slice(0,3)]);S.quiz.ans=null;}

// ---- Pola Kalimat enrichment ----
function stripTags(s){return String(s).replace(/<[^>]+>/g,"");}
function stripTags(s){return String(s).replace(/<[^>]+>/g,"");}
// Legenda simbol pola (V/N/KS/KB) agar judul seperti V-ないで mudah dimengerti
const PAT_LEGEND=[
 ["V","kata kerja (mis. 食べます・たべます = makan)"],
 ["V-stem","kata kerja tanpa ます (mis. 食べ → tabé)"],
 ["N","kata benda (mis. 本・ほん = buku)"],
 ["KS-i","kata sifat-i (mis. 高い・たかい = mahal/tinggi)"],
 ["KS-na","kata sifat-na (mis. 静か・しずか = tenang)"],
 ["KB","kata benda/kalimat benda (pelengkap です)"],
 ["S","kalimat lengkap"]
];
// Info pola per "lid-gi": judul Indonesia + rumus + pemakaian + kesalahan umum + beda pola
// Menutupi 91 pola (25 bab). Field kosong = box disembunyikan.
const PAT_INFO={
"1-0":{j:"Pernyataan: A adalah B",r:"N1 は N2 です",p:"Memperkenalkan atau menyatakan identitas dan status. Partikel は menandai topik pembicaraan.",s:"Jangan pakai 先生 untuk diri sendiri (pakai 教師). Jangan tertukar は (topik) dengan が (pelaku/fokus).",b:"Beda dengan じゃありません (negatif) dan ですか (tanya)."},
"1-1":{j:"Negatif: A bukan B",r:"N1 は N2 じゃありません",p:"Menyangkal identitas atau status dengan sopan.",s:"Bentuk kasualnya じゃない, tapi untuk ujian dan atasan pakai じゃありません.",b:"Pasangan dari は〜です (positif)."},
"1-2":{j:"Tanya: apakah A adalah B?",r:"N1 は N2 ですか",p:"Bertanya identitas. Jawab dengan はい/いいえ + です/じゃありません.",s:"Jangan jawab cukup はい saja untuk identitas orang; ulangi predikatnya.",b:"Pasangan tanya dari は〜です."},
"1-3":{j:"Juga (pengganti は)",r:"N も 〜です",p:"Menyatakan hal yang sama berlaku untuk N. Kata も menggantikan posisi は.",s:"も dan は tidak dipakai bersamaan (×はも).",b:"Beda dengan の (milik)."},
"1-4":{j:"Milik atau berkaitan: B milik/terkait A",r:"N1 の N2",p:"Menyatakan milik, asal, atau hubungan (私の本, 日本の車).",s:"Urutan terbalik dari Indonesia: pemilik dulu, baru bendanya.",b:"Beda dengan は (topik)."},
"2-0":{j:"Menunjuk benda: ini/itu adalah N",r:"これ・それ・あれ は N です",p:"これ = dekat saya, それ = dekat lawan bicara, あれ = jauh dari keduanya.",s:"Jangan pakai これ untuk orang (pakai こちら/この方).",b:"Beda dengan この〜 (harus diikuti benda)."},
"2-1":{j:"Menerangkan benda spesifik",r:"この・その・あの + N は〜です",p:"この本 = buku ini (fisik dekat). Selalu diikuti kata benda.",s:"この tanpa benda adalah salah (×このは本です).",b:"Beda dengan これ (berdiri sendiri)."},
"2-2":{j:"Ya begitu / bukan begitu",r:"そうです / そうじゃありません",p:"Menyetujui atau menolak pernyataan lawan bicara.",s:"そうです untuk setuju isi, bukan untuk menjawab ya/tidak semua pertanyaan.",b:"Beda dengan はい/いいえ yang menjawab pertanyaan ya/tidak."},
"2-3":{j:"Pilihan: yang ini atau yang itu?",r:"〜か、〜か",p:"Menawarkan atau bertanya pilihan di antara dua hal.",s:"か di tengah pilihan tidak perlu ですか.",b:"Beda dengan ですか tunggal."},
"2-4":{j:"Buatan, asal, atau milik",r:"N1 の N2",p:"Contoh: 日本の車 (mobil Jepang), 私のかばん (tasku).",s:"Sama rumusnya dengan Bab 1, konteksnya benda.",b:"Beda dengan は (topik)."},
"3-0":{j:"Di sini/situ/sana adalah N",r:"ここ・そこ・あそこ は N です",p:"Menyebut fungsi tempat (ここは教室です = di sini ruang kelas).",s:"ここ/そこ/あそこ untuk tempat, こちら versi sopannya.",b:"Beda dengan NはTempatです (subjeknya bendanya)."},
"3-1":{j:"N ada di tempat X",r:"N は Tempat です",p:"Menyebut lokasi benda atau orang.",s:"Untuk orang hidup pakai います di pola Bab 10, bukan です.",b:"Kebalikan sudut pandang dari ここはNです."},

"4-0":{j:"Jam berapa sekarang",r:"今 〜時 〜分 です",p:"Menyebut jam: 時 (jam), 分 (menit), 半 (setengah).",s:"半 hanya untuk :30. Pagi/siang pakai 午前/午後 agar jelas.",b:"Beda dengan durasi (〜時間, Bab 11)."},

"8-2":{j:"Sifat + benda",r:"KS-na + な + N / KS-i + N",p:"Contoh: 静かな町, 高い山.",s:"な hanya untuk KS-na; KS-i tidak pakai な.",b:"Inti Bab 8."},

"14-0":{j:"Kelompok kata kerja (dasar)",r:"Grup I・II・III",p:"Dasar untuk membentuk te/tai/nai/ta. Grup II mayoritas 〜える/〜いる, grup III hanya する・来る.",s:"帰る・入る・切る terlihat seperti grup II tapi grup I.",b:"Wajib paham sebelum menghafal te."},

"14-2":{j:"Tolong lakukan ~",r:"V-て ください",p:"Permintaan santun (tolong). Contoh: 見せてください.",s:"Ini permintaan, bukan perintah kasar.",b:"Beda dengan ています (sedang)."},

"15-2":{j:"Keadaan yang berlanjut",r:"V-て います (hasil)",p:"Contoh: 知っています (sudah tahu), 結婚しています (sudah menikah).",s:"Beda makna dengan sedang berlangsung Bab 14; lihat konteks katanya.",b:"Bab 14 = aksi berjalan, Bab 15 = status hasil."},
"16-0":{j:"Rangkaian aksi berurutan",r:"V1-て、V2-て、V3ます",p:"Cerita urutan:起きて、食べて、出かけます.",s:"Semua kecuali terakhir pakai て.",b:"Beda dengan てから (penegas setelah)."},

"17-0":{j:"Bentuk-nai (negatif kasual)",r:"V-ない形",p:"Dasar larangan dan kewajiban. U baba: う→わ +ない, く→か +ない, す→さ +ない, dsb.",s:"する→しない, 来る→こない (spesial).",b:"Alat untuk 3 pola di bawah."},

"19-2":{j:"Kegiatan selang-seling / contoh",r:"V1-たり、V2-たり します",p:"Contoh: 休みは寝たり、テレビを見たりします.",s:"Minimal dua tari; diakhiri します.",b:"Beda dengan te-berurutan (urutan pasti)."},

"20-1":{j:"Bentuk biasa (kasual)",r:"普通体: kamus・ない・た, KS-i, KS-na(+だ)",p:"Untuk teman akrab dan keluarga.",s:"Jangan pakai ke atasan. Tanya biasa tanpa か + ↗.",b:"Pasangan kasual dari sopan."},

function patternDetail(lid,gi){
  const L=LESSONS.find(l=>l.id===lid); const raw=L.grammar[gi]||"";
  const title=(raw.match(/<b>(.*?)<\/b>/)||[,"Pola"])[1];
  const desc=stripTags(raw).replace(title,"").replace(/^ — /,"");
  // contoh + breakdown generik per bab agar detail & tidak kaku
  const bank={
    1:{ex:[["わたしは 学生です","わたしは がくせいです","Saya adalah murid"],["ミラーさんは 会社員じゃありません","ミラーさんは かいしゃいんじゃありません","Sdri Miller bukan karyawan"]],tips:"は menandai topik. Bukan partikel subjek が."},
    4:{ex:[["7時に 起きます","7じに おきます","Bangun jam 7"],["6時から 9時まで 働きます","6じから 9じまで はたらきます","Bekerja dari jam 6 sampai 9"]],tips:"に wajib untuk jam/hari spesifik, jangan pakai untuk 毎日・昨日."},

  };

function act(el,e){
  if(e)e.stopPropagation();
  const a=el.dataset.a;
  if(a==="go")setTab(el.dataset.t);
  else if(a==="open"){S.lesson=+el.dataset.id;S.tab="lessons";render();}
  else if(a==="back"){S.lesson=null;render();}
  else if(a==="speak"){speak(el.dataset.t);if(S.tab==="quiz"&&S.quiz.mode==="listen"){/* jangan bocorkan */}}

  else if(a==="fc-next"){S.fcIdx=(S.fcIdx+1)%S.fcList.length;S.flip=false;render();}
  else if(a==="fc-prev"){S.fcIdx=(S.fcIdx-1+S.fcList.length)%S.fcList.length;S.flip=false;render();}
  else if(a==="grade"){const w=S.fcList[S.fcIdx%S.fcList.length];const q=+el.dataset.q;srsReview(w.k,q);if(q>=3){addXP(5,1,1,1);toast("✅ +5 XP • interval bertambah");}else{addXP(1,1,0,1);toast("🔁 Masuk antrian besok (SM-2)");}S.fcIdx++;if(S.fcIdx>=S.fcList.length){confetti(30);resetSRSQueue();toast("🎉 Sesi SRS selesai!");}S.flip=false;render();}
  else if(a==="srs-bab"){const id=+el.dataset.id;S.fcList=shuffle(LESSONS.find(l=>l.id===id).vocab.map((v,i)=>({lid:id,title:"",idx:i,jp:v[0],kana:v[1],roma:v[2],mean:v[3],k:key(id,i)})));S.fcIdx=0;S.flip=false;setTab("flashcard");}
  else if(a==="quiz-bab"){const id=+el.dataset.id;quizInit("pg-jp");S.quiz.q=shuffle(LESSONS.find(l=>l.id===id).vocab.map((v,i)=>({lid:id,idx:i,jp:v[0],kana:v[1],roma:v[2],mean:v[3],k:key(id,i)}))).slice(0,15);S.quiz.i=0;S.quiz.score=0;newQuizOpts();setTab("quiz");}

  else if(a==="q-ans"){if(S.quiz.ans)return;const w=S.quiz.q[S.quiz.i];const ok=el.dataset.k===w.k;S.quiz.ans=el.dataset.k;if(ok){S.quiz.score++;addXP(10,1,1,1);srsReview(w.k,4);}else{srsReview(w.k,2);addXP(1,1,0,1);}render();}
  else if(a==="q-type")doTypeCheck();
  else if(a==="q-next"){S.quiz.i++;if(S.quiz.i<S.quiz.q.length)newQuizOpts();else{confetti(30);}render();}
  else if(a==="pat-bab"){S.patLesson=+el.dataset.id;S.patModeDetail="list";S.tab="pattern";render();}
  else if(a==="pat-back"||a==="pat-list"){S.patModeDetail="list";render();}
  else if(a==="pat-open"){S.patLesson=+el.dataset.l;S.patIdx=+el.dataset.g;S.patModeDetail="detail";S.patQuiz=null;patBuild=[];S.tab="pattern";render();}
  else if(a==="pat-new"){S.patQuiz=patternQuiz(S.patLesson,S.patIdx);patBuild=[];render();}
  else if(a==="pat-tok"){patBuild.push(el.dataset.t);const b=$("#pat-build");if(b)b.textContent=patBuild.join(" ");speak(el.dataset.t,1);}
  else if(a==="pat-check-susun"){const fb=$("#pat-fb");const ans=S.patQuiz.answer;const got=patBuild.join(" ");if(got===ans){fb.innerHTML="✅ <b class='text-emerald-300'>Benar! +10 XP</b>";addXP(10,1,1,1);PAT[S.patLesson+"-"+S.patIdx]=1;save();confetti(20);}else fb.innerHTML=`❌ Belum tepat. Kunci: <b>${esc(ans)}</b> <button data-a="speak" data-t="${esc(ans)}" class="underline text-sky-300">dengar</button>`;if(fb)fb.querySelectorAll("[data-a]").forEach(b=>b.onclick=ev=>act(b,ev));}
  else if(a==="pat-check")doPatCheck();
  else if(a==="chal-start"){chalStart();}
  else if(a==="chal-ans"){const ok=el.dataset.ok==="1";const cur=S.chal.q[S.chal.i];if(ok)S.chal.score++;if(cur.w)srsReview(cur.w.k,ok?4:2);addXP(ok?10:1,0,ok?1:0,1);S.chal.i++;if(S.chal.i>=S.chal.q.length){S.chal.last={score:S.chal.score,total:S.chal.q.length};chalFinish();}else render();}
  else if(a==="gboard-load"){loadGlobal();}
}
async function loadGlobal(){const box=$("#gboard");const sc=getSupa();if(!sc){if(box)box.textContent="Offline — "+(supaStatus().reason||"")+" — buka 🔌 DB untuk atur.";return;}if(box)box.textContent="Memuat...";try{const {data,error}=await sc.from("study_logs").select("user_id,xp,created_at").gte("created_at",weekStart().toISOString()).limit(200);if(error)throw error;const m={};data.forEach(r=>m[r.user_id]=(m[r.user_id]||0)+r.xp);const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10);if(box)box.innerHTML=arr.map(([u,x],i)=>`<div class="flex justify-between py-0.5"><span>${i+1}. ${esc(u.slice(0,8))}…</span><b class="text-sky-300">${x} XP</b></div>`).join("")||"Belum ada data minggu ini.";}catch(e){if(box)box.textContent="Gagal: "+e.message;}}
// Supabase: coba fetch vocab/pola (opsional, fallback tetap jalan)
async function trySupabase(){
  const sc=getSupa();
  if(!sc){render();return;}
  try{
    const {data:ls,error:e1}=await sc.from("lessons").select("*").order("id");
    if(e1) throw e1;
    const {data:vc,error:e2}=await sc.from("vocab").select("*").order("lesson_id").limit(2000);
    if(e2) throw e2;
    if(ls&&ls.length&&vc&&vc.length){
      LESSONS=ls.map(l=>({id:l.id,title:l.title,vocab:vc.filter(v=>v.lesson_id===l.id).map(v=>[v.jp,v.kana,v.romaji,v.mean]),grammar:(FALLBACK.find(f=>f.id===l.id)?.grammar||[])}));
      DATA_SRC="Supabase";
      console.log("[Zipun] Loaded from Supabase:",ls.length,"lessons,",vc.length,"vocab");
    } else {
      DATA_SRC="lokal (Supabase tabel kosong — isi vocab dulu)";
      console.log("[Zipun] Supabase connected tapi vocab kosong, pakai lokal");
    }
  }catch(e){console.warn("[Zipun] Supabase fetch gagal, pakai lokal:",e.message||e);DATA_SRC="lokal (fetch gagal: "+(e.message||"err")+")";}
  render();
}
async function testSupa(){
  const res=$("#supa-test-res"); const url=$("#in-supa-url").value.trim(); const key=$("#in-supa-key").value.trim();
  if(!url||!key){if(res)res.textContent="Isi URL + Key dulu.";return;}
  if(!window.supabase){if(res)res.textContent="CDN supabase-js belum termuat (cek internet).";return;}
  if(res)res.textContent="Mengetes...";
  try{
    const c=window.supabase.createClient(url,key);
    const {error}=await c.from("lessons").select("id").limit(1);
    if(error) throw error;
    if(res)res.innerHTML="✅ <b class='text-emerald-300'>Koneksi OK, tabel lessons bisa dibaca.</b> Klik Simpan & Reload.";
  }catch(e){if(res)res.textContent="❌ Gagal: "+(e.message||e);}
}

$("#modal-close").onclick=()=>$("#modal").style.display="none";
$("#modal-save").onclick=()=>{GOAL={xp:+$("#in-xp").value||300,words:+$("#in-words").value||100,days:+$("#in-days").value||5};save();$("#modal").style.display="none";render();toast("🎯 Target disimpan");};
$("#supa-close").onclick=()=>$("#supa-modal").style.display="none";
$("#supa-clear").onclick=()=>{if(typeof zipunClearCreds==="function")zipunClearCreds();};
$("#supa-test").onclick=testSupa;
$("#supa-save").onclick=()=>{const u=$("#in-supa-url").value.trim(),k=$("#in-supa-key").value.trim();if(!u||!k){$("#supa-test-res").textContent="Isi URL + Key dulu.";return;}if(typeof zipunSaveCreds==="function")zipunSaveCreds(u,k);};
quizInit("pg-jp"); resetSRSQueue(); render(); trySupabase();
})();
